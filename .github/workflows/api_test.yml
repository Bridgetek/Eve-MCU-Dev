name: Test API

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      # Trigger script on push to 'development' branch
      #- development
      # Trigger script on push to 'main' branch
      - 'main'
    paths:
      # Trigger if this workflow file changes
      - '.github/workflows/api_test.yml'
      # Trigger script on push to test directory
      - 'test/**'
      # Trigger script on push to API
      - 'include/**'
      - 'source/**'
  # Add "Run workflow" button
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug
  # Allow a custom build directory
  BUILD_DIR: build
  # Executable program made by the CMake build (location and name depend on compiler)
  TARGET: apitester

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        eve: [ 
          {name: "API1/FT800", config: "-DEVE_DISPLAY_RES=EVE_QVGA -DEVE_DEVICE=EVE_FT800", gild: "api1.txt" }, 
          {name: "API2/FT813", config: "-DEVE_PANEL=EVE_DP_0431_11A -DEVE_DEVICE=EVE_FT813", gild: "api2.txt" }, 
          {name: "API3/BT815", config: "-DEVE_DISPLAY_RES=EVE_WVGA -DEVE_DEVICE=EVE_BT815", gild: "api3.txt" }, 
          {name: "API4/BT817", config: "-DEVE_MODULE=EVE_IDM20407A", gild: "api4.txt" }, 
          {name: "API5/BT820", config: "-DEVE_DISPLAY_RES=EVE_WUXGA -DEVE_DEVICE=EVE_BT820", gild: "api5.txt" }, 
        ]
    
    # Set the name of the job to include the important information
    name: test api - ${{ matrix.eve.name }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'false'

    # Test using matrix
    - name: Configure CMake
      run: cmake -B ${{env.BUILD_DIR}} -S . -G Ninja ${{matrix.eve.config}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      working-directory: ${{github.workspace}}/test/apitester

    - name: Build
      run: cmake --build ${{env.BUILD_DIR}}
      working-directory: ${{github.workspace}}/test/apitester

    - name: Run test 
      run: ./${{env.BUILD_DIR}}/${{env.TARGET}} > ./${{env.BUILD_DIR}}/${{matrix.eve.gild}}
      working-directory: ${{github.workspace}}/test/apitester

    - name: Compare results
      run: diff -s -a -w ./gilds/${{matrix.eve.gild}} ./${{env.BUILD_DIR}}/${{matrix.eve.gild}}
      working-directory: ${{github.workspace}}/test/apitester
