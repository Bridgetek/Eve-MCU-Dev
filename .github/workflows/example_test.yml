name: Test Examples

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      # Trigger script on push to 'development' branch
      #- development
      # Trigger script on push to 'main' branch
      - 'main'
    paths:
      # Trigger if this workflow file changes
      - '.github/workflows/example_test.yml'
      # Trigger script on push to test directory
      - 'test/**'
      # Trigger script on push to API
      - 'include/**'
      - 'source/**'
      - 'examples/**'
  # Add "Run workflow" button
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        eve: [ 
          {EXAMPLE: simple, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: b2tf, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: cruise, ASSETS: 0, EVE1: false, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: datavisualiser, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: flightdeck, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: fontmagic, ASSETS: 0, EVE1: false, EVE2: false, EVE3: false, EVE4: false, EVE5: EVE_WUXGA }, 
          {EXAMPLE: gyminterval, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: medinfo, ASSETS: USE_C_ARRAYS, EVE1: false, EVE2: false, EVE3: EVE_FULLHD, EVE4: EVE_FULLHD, EVE5: EVE_WUXGA }, 
          {EXAMPLE: racecar, ASSETS: USE_C_ARRAYS, EVE1: false, EVE2: false, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: submarine, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
          {EXAMPLE: touchscreentest, ASSETS: 0, EVE1: EVE_QVGA, EVE2: EVE_WQVGA, EVE3: EVE_WVGA, EVE4: EVE_WXGA, EVE5: EVE_WUXGA }, 
        ]
    
    # Set the name of the job to include the important information
    name: test example - ${{ matrix.eve.EXAMPLE }}

    steps:
    - uses: actions/checkout@v6

    # Test using matrix
    - name: Configure CMake EVE5
      if: ${{ matrix.eve.EVE5 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT820 -DEVE_DISPLAY_RES=${{ matrix.eve.EVE5 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE5
      if: ${{ matrix.eve.EVE5 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE4
      if: ${{ matrix.eve.EVE4 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT818 -DEVE_DISPLAY_RES=${{ matrix.eve.EVE4 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE4
      if: ${{ matrix.eve.EVE4 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE3
      if: ${{ matrix.eve.EVE3 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT815 -DEVE_DISPLAY_RES=${{ matrix.eve.EVE3 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE3
      if: ${{ matrix.eve.EVE3 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE2
      if: ${{ matrix.eve.EVE2 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_FT812 -DEVE_DISPLAY_RES=${{ matrix.eve.EVE2 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE2
      if: ${{ matrix.eve.EVE2 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE1
      if: ${{ matrix.eve.EVE1 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_FT800 -DEVE_DISPLAY_RES=${{ matrix.eve.EVE1 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE1
      if: ${{ matrix.eve.EVE1 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    # Do not run the executable as it may not support the operations - we are testing compilation only
    #- name: Run test 
    #  run: ${{github.workspace}}/test/exampletester/build/exampletester
