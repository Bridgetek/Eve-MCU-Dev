name: Test Examples

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      # Trigger script on push to 'development' branch
      #- development
      # Trigger script on push to 'main' branch
      - 'main'
    paths:
      # Trigger if this workflow file changes
      - '.github/workflows/example_test.yml'
      # Trigger script on push to test directory
      - 'test/**'
      # Trigger script on push to API
      - 'include/**'
      - 'source/**'
      - 'examples/**'
  # Add "Run workflow" button
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        eve: [ 
          {EXAMPLE: simple, GILDED: true, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: b2tf, GILDED: true, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: cruise, GILDED: false, ASSETS: 0, EVE1: false, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: datavisualiser, GILDED: false, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: flightdeck, GILDED: false, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: fontmagic, GILDED: false, ASSETS: 0, EVE1: false, EVE2: false, EVE3: false, EVE4: false, EVE5: WUXGA }, 
          {EXAMPLE: gyminterval, GILDED: true, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: medinfo, GILDED: false, ASSETS: USE_C_ARRAYS, EVE1: false, EVE2: false, EVE3: FULLHD, EVE4: FULLHD, EVE5: WUXGA }, 
          {EXAMPLE: racecar, GILDED: false, ASSETS: USE_C_ARRAYS, EVE1: false, EVE2: false, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: submarine, GILDED: false, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA }, 
          {EXAMPLE: touchscreentest, GILDED: false, ASSETS: 0, EVE1: QVGA, EVE2: WQVGA, EVE3: WVGA, EVE4: WXGA, EVE5: WUXGA}, 
        ]
    
    # Set the name of the job to include the important information
    name: test example - ${{ matrix.eve.EXAMPLE }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'false'

    # Test using matrix
    - name: Configure CMake EVE5
      if: ${{ matrix.eve.EVE5 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT820 -DEVE_DISPLAY_RES=EVE_${{ matrix.eve.EVE5 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE5
      if: ${{ matrix.eve.EVE5 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Run EVE5
      if: ${{ matrix.eve.EVE5 }}
      run: ./build/exampletester > ./build/${{ matrix.eve.EXAMPLE }}_BT820_${{ matrix.eve.EVE5 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Compare results EVE5
      if: ${{ matrix.eve.GILDED && matrix.eve.EVE5 }}
      run: diff -s -a -w ./gilds/${{ matrix.eve.EXAMPLE }}_BT820_${{ matrix.eve.EVE5 }}.txt ./build/${{ matrix.eve.EXAMPLE }}_BT820_${{ matrix.eve.EVE5 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE4
      if: ${{ matrix.eve.EVE4 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT818 -DEVE_DISPLAY_RES=EVE_${{ matrix.eve.EVE4 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE4
      if: ${{ matrix.eve.EVE4 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Run EVE4
      if: ${{ matrix.eve.EVE4 }}
      run: ./build/exampletester > ./build/${{ matrix.eve.EXAMPLE }}_BT818_${{ matrix.eve.EVE4 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Compare results EVE4
      if: ${{ matrix.eve.GILDED && matrix.eve.EVE4 }}
      run: diff -s -a -w ./gilds/${{ matrix.eve.EXAMPLE }}_BT818_${{ matrix.eve.EVE4 }}.txt ./build/${{ matrix.eve.EXAMPLE }}_BT818_${{ matrix.eve.EVE4 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE3
      if: ${{ matrix.eve.EVE3 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_BT815 -DEVE_DISPLAY_RES=EVE_${{ matrix.eve.EVE3 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE3
      if: ${{ matrix.eve.EVE3 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Run EVE3
      if: ${{ matrix.eve.EVE3 }}
      run: ./build/exampletester > ./build/${{ matrix.eve.EXAMPLE }}_BT815_${{ matrix.eve.EVE3 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Compare results EVE3
      if: ${{ matrix.eve.GILDED && matrix.eve.EVE3 }}
      run: diff -s -a -w ./gilds/${{ matrix.eve.EXAMPLE }}_BT815_${{ matrix.eve.EVE3 }}.txt ./build/${{ matrix.eve.EXAMPLE }}_BT815_${{ matrix.eve.EVE3 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE2
      if: ${{ matrix.eve.EVE2 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_FT812 -DEVE_DISPLAY_RES=EVE_${{ matrix.eve.EVE2 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE2
      if: ${{ matrix.eve.EVE2 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Run EVE2
      if: ${{ matrix.eve.EVE2 }}
      run: ./build/exampletester > ./build/${{ matrix.eve.EXAMPLE }}_FT812_${{ matrix.eve.EVE2 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Compare results EVE2
      if: ${{ matrix.eve.GILDED && matrix.eve.EVE2 }}
      run: diff -s -a -w ./gilds/${{ matrix.eve.EXAMPLE }}_FT812_${{ matrix.eve.EVE2 }}.txt ./build/${{ matrix.eve.EXAMPLE }}_FT812_${{ matrix.eve.EVE2 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Configure CMake EVE1
      if: ${{ matrix.eve.EVE1 }}
      run: cmake -B build -S . -G Ninja -DEVE_DEVICE=EVE_FT800 -DEVE_DISPLAY_RES=EVE_${{ matrix.eve.EVE1 }} -DEXAMPLE=${{ matrix.eve.EXAMPLE }} -DASSETS=${{ matrix.eve.ASSETS }}
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Build EVE1
      if: ${{ matrix.eve.EVE1 }}
      run: cmake --build build
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Run EVE1
      if: ${{ matrix.eve.EVE1 }}
      run: ./build/exampletester > ./build/${{ matrix.eve.EXAMPLE }}_FT800_${{ matrix.eve.EVE1 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester

    - name: Compare results EVE1
      if: ${{ matrix.eve.GILDED && matrix.eve.EVE1 }}
      run: diff -s -a -w ./gilds/${{ matrix.eve.EXAMPLE }}_FT800_${{ matrix.eve.EVE1 }}.txt ./build/${{ matrix.eve.EXAMPLE }}_FT800_${{ matrix.eve.EVE1 }}.txt
      working-directory: ${{github.workspace}}/test/exampletester
