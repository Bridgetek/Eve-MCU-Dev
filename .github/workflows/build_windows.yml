name: Build Simple Example for MinGW on Windows (libFT4222 and libMPSSE)

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      # Trigger script on push to 'development' branch
      #- development
      # Trigger script on push to 'main' branch
      - main
    paths:
      # Trigger if this workflow file changes
      - '.github/workflows/build_windows.yml'
      # Trigger script on push to windows simple example
      - 'examples/simple/common'
      - 'examples/simple/libft4222'
      - 'examples/simple/libmpsse'
      # Trigger on API change
      - 'include/**'
      - 'source/**'
      - 'ports/**'
  # Add "Run workflow" button
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: windows-latest

    strategy:
      max-parallel: 1
      matrix:
        example: [
          {dir: libft4222,      compiler: none, library: libft4222},
          {dir: libmpsse,       compiler: none, library: libmpsse },
        ]
        eve: [ 
          {name: "FT800/QVGA", config: "-DEVE_DISPLAY_RES=EVE_QVGA -DEVE_DEVICE=EVE_FT800" }, 
          {name: "FT813/WQVGA", config: "-DEVE_PANEL=EVE_DP_0431_11A -DEVE_DEVICE=EVE_FT813" }, 
          {name: "BT815/WVGA", config: "-DEVE_DISPLAY_RES=EVE_WVGA -DEVE_DEVICE=EVE_BT815" }, 
          {name: "BT817(IDM2040-7A)", config: "-DEVE_MODULE=IDM20407A" }, 
          {name: "BT820/WUXGA", config: "-DEVE_DISPLAY_RES=EVE_WUXGA -DEVE_DEVICE=EVE_BT820" }, 
        ]
    
    # Set the name of the job to include the important information
    name: build ${{ matrix.example.dir }} - ${{ matrix.eve.name }}

    defaults:
      run:
        shell: cmd

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'

    - name: Setup path for MinGW
      run: set PATH = "C:\msys64\ucrt64\bin;C:\msys64\usr\bin;%PATH%"

    # Test using matrix
    - name: Configure CMake
      run: cmake -B build -S . -G "MinGW Makefiles" ${{ matrix.eve.config }} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
      working-directory: ${{github.workspace}}/examples/simple/${{ matrix.example.dir }}

    - name: Build
      run: cmake --build build
      working-directory: ${{github.workspace}}/examples/simple/${{ matrix.example.dir }}
